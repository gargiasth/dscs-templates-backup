<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Posit Connect Sample</title>
    <style>
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #f5f7fb;
        color: #172b4d;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 36rem;
        padding: 2.5rem;
        border-radius: 0.75rem;
        background: white;
        box-shadow: 0 0.5rem 2rem rgb(23 43 77 / 12%);
      }
      h1 { margin-top: 0; }
      code {
        padding: 0.15rem 0.3rem;
        border-radius: 0.25rem;
        background: #edf2f7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Posit Connect sample app</h1>
      <p>This Flask application is ready to publish to Posit Connect.</p>
      <p>Deploy it with <code>rsconnect deploy flask</code>.</p>
    </main>
  </body>
</html>
