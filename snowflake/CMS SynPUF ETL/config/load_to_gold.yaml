# Reference copy only — not read from disk at runtime. The actual
# spec text lives inside the load_to_gold_job stored procedure, which
# substitutes <SAMPLE_NUMBER> with whatever value is passed to
# CALL load_to_gold_job(n).
spec:
  containers:
    - name: load-to-gold
      image: a0439390499571-xrc81538.registry.snowflakecomputing.com/etl_cms/etl_cms_bronze/etl_cms_repo/etl-cms-image:latest
      command: ["python", "/app/spcs/etl_snowflake/load_to_gold.py", "<SAMPLE_NUMBER>"]
      env:
        SNOWFLAKE_DATABASE: ETL_CMS
        SNOWFLAKE_SILVER_SCHEMA: ETL_CMS_SILVER
        SNOWFLAKE_SCHEMA: OHDSI_CDM
        SNOWFLAKE_ETL_OUTPUT_STAGE: ETL_OUTPUT