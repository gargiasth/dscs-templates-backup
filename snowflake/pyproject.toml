[project]
name = "dscs_templates"
version = "0.1.0"
requires-python = ">=3.10,<3.15"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "config",
    "ingestion",
    "transforms",
    "validation",
    "utils",
    "dagster",
    "spcs",
]


[tool.pytest.ini_options]
filterwarnings = ["ignore::UserWarning"]
addopts = "--cov=. --cov-fail-under=70"