bundle:
  name: etl-cms-ohdsi
variables:
  catalog:
    default: etl_cms
  schema:
    default: ohdsi_cdm
  volume:
    default: ohdsi_volume
  control_subfolder_path:
    default: /Volumes/etl_cms/ohdsi_cdm/ohdsi_volume/control
  tmp_subfolder_path:
    default: /Volumes/etl_cms/ohdsi_cdm/ohdsi_volume/tmp
  synpuf_raw_subfolder_path:
    default: /Volumes/etl_cms/ohdsi_cdm/ohdsi_volume/synpuf_raw
  silver_output_subfolder_path:
    default: /Volumes/etl_cms/ohdsi_cdm/ohdsi_volume/silver_output
include:
- resources/*.yml
targets:
  dev:
    default: true
    workspace:
      host: https://adb-1234567890.12.azuredatabricks.net
