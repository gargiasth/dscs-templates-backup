resources:
  jobs:
    etl-cms-ohdsi:
      name: etl-cms-ohdsi
      environments:
      - environment_key: default_env
        spec:
          client: '3'
          dependencies: [sqlglot, python-dotenv]
      tasks:
      - task_key: orion_preflight
        environment_key: default_env
        spark_python_task:
          python_file: ../utilities/wrappers/run_orion_preflight.py
          parameters:
          - ${var.catalog}
          - ${var.schema}
          - ${var.volume}
      - task_key: bronze_table_setup_create_cdmv5_tables_sql
        environment_key: default_env
        spark_python_task:
          python_file: ../utilities/wrappers/run_bronze_table_setup_create_cdmv5_tables_sql.py
          parameters:
          - ${var.catalog}
          - ${var.schema}
        depends_on:
        - task_key: orion_preflight
      - task_key: bronze_bronze_get_synpuf_files_py
        environment_key: default_env
        spark_python_task:
          python_file: ../utilities/wrappers/run_bronze_bronze_get_synpuf_files_py.py
          parameters:
          - ${var.raw_data_subfolder_path}
          - '1'
          - ORION_OUTPUT=${var.raw_data_subfolder_path}
        depends_on:
        - task_key: orion_preflight
      - task_key: silver_silver_cms_synpuf_etl_cdm_v5_py
        environment_key: default_env
        spark_python_task:
          python_file: ../utilities/wrappers/run_silver_silver_cms_synpuf_etl_cdm_v5_py.py
          parameters:
          - '1'
          - BASE_SYNPUF_INPUT_DIRECTORY=${var.raw_data_subfolder_path}
          - BASE_OUTPUT_DIRECTORY=${var.silver_output_subfolder_path}
          - BASE_ETL_CONTROL_DIRECTORY=${var.control_subfolder_path}
          - BASE_OMOP_INPUT_DIRECTORY=${var.omop_tables_subfolder_path}
          - SYNPUF_DIR_FORMAT=DE_{0}
          - ORION_INPUT=${var.raw_data_subfolder_path}|upstream task bronze_bronze_get_synpuf_files_py
          - ORION_OUTPUT=${var.silver_output_subfolder_path}
        depends_on:
        - task_key: bronze_bronze_get_synpuf_files_py
